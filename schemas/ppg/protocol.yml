protocol: ppg
version: 1
description: Lossless PPG samples in the BLE sensor stream. Firmware 2.3.x packs four 19-bit channels into ten bytes; earlier firmware and all SD files use four uint32 values.

messages:
  legacy_sample:
    description: Unchanged SD/.oe sample and BLE sample before firmware 2.3.0. Channel order is red, infrared, green, ambient.
    fields:
      - name: red
        type: uint32
      - name: infrared
        type: uint32
      - name: green
        type: uint32
      - name: ambient
        type: uint32
  compact_sample:
    description: BLE only from firmware 2.3.0. Concatenate red, infrared, green, ambient as four unsigned 19-bit values, least significant bit first. The high four bits of bits_64_79 are zero. See README for bit extraction and firmware selection.
    fields:
      - name: bits_0_31
        type: uint32
      - name: bits_32_63
        type: uint32
      - name: bits_64_79
        type: uint16

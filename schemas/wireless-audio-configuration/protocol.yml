protocol: wireless-audio-configuration
version: 1
description: Extensible protocol for configuring Bluetooth link policies and LE Audio preferences and for observing negotiated runtime state.

transport:
  ble:
    service_uuid: 5bddd959-06f3-4029-85d3-5471b1eda18a
    characteristics:
      - name: command
        uuid: 150c77b5-4d1e-4b87-a0d9-647001946358
        properties: [write]
      - name: response
        uuid: 1ae8ed46-b23c-48ba-8e67-5713a4a4dc69
        properties: [indicate]
      - name: runtime_state
        uuid: 922b3b49-cad3-44ce-a6b7-97abda85a8dd
        properties: [read, notify]
      - name: capabilities
        uuid: 1018f0be-9f05-4c73-a24b-944a20c57fe3
        properties: [read]

messages:
  controller_default_acl_policy:
    description: Leaves ACL connection parameter selection to the Bluetooth stack and peer; reserved must be zero.
    fields:
      - name: reserved
        type: uint8

  fixed_acl_policy:
    description: Requests one fixed ACL connection interval together with peripheral latency and supervision timeout.
    fields:
      - name: interval_us
        type: uint32
      - name: peripheral_latency
        type: uint16
      - name: supervision_timeout_ms
        type: uint32

  adaptive_linear_acl_policy:
    description: Increases the ACL interval by a fixed step after an audio underrun episode and decreases it periodically while audio is stable.
    fields:
      - name: minimum_interval_us
        type: uint32
      - name: maximum_interval_us
        type: uint32
      - name: underrun_increase_step_us
        type: uint32
      - name: recovery_decrease_step_us
        type: uint32
      - name: recovery_period_ms
        type: uint32
      - name: minimum_update_period_ms
        type: uint32
      - name: peripheral_latency
        type: uint16
      - name: supervision_timeout_ms
        type: uint32

  acl_connection_policy:
    description: A tagged ACL connection policy. Type 0 uses controller defaults, type 1 requests a fixed interval, and type 2 uses linear underrun adaptation.
    fields:
      - name: policy
        type: union
        tag_type: uint8
        variants:
          0: controller_default_acl_policy
          1: fixed_acl_policy
          2: adaptive_linear_acl_policy

  acl_radio_preferences:
    description: Optional ACL PHY and data length preferences selected by fields_present bits defined by the protocol specification.
    fields:
      - name: fields_present
        type: uint16
      - name: transmit_phy_mask
        type: uint8
      - name: receive_phy_mask
        type: uint8
      - name: transmit_max_data_octets
        type: uint16
      - name: transmit_max_time_us
        type: uint16

  lc3_preferences:
    description: Optional LC3 codec preferences for one or both audio directions, selected by fields_present bits.
    fields:
      - name: fields_present
        type: uint16
      - name: direction_mask
        type: uint8
      - name: sampling_frequency_hz
        type: uint32
      - name: frame_duration_us
        type: uint16
      - name: octets_per_frame
        type: uint16
      - name: frame_blocks_per_sdu
        type: uint8
      - name: channel_allocation
        type: uint32

  iso_qos_preferences:
    description: Optional Connected Isochronous Stream QoS preferences for one or both audio directions, selected by fields_present bits.
    fields:
      - name: fields_present
        type: uint32
      - name: direction_mask
        type: uint8
      - name: sdu_interval_us
        type: uint32
      - name: framing
        type: uint8
      - name: phy_mask
        type: uint8
      - name: retransmission_number
        type: uint8
      - name: maximum_sdu_octets
        type: uint16
      - name: maximum_transport_latency_ms
        type: uint16
      - name: presentation_delay_us
        type: uint32
      - name: minimum_presentation_delay_us
        type: uint32
      - name: maximum_presentation_delay_us
        type: uint32
      - name: preferred_minimum_presentation_delay_us
        type: uint32
      - name: preferred_maximum_presentation_delay_us
        type: uint32

  set_acl_connection_policy:
    description: Selects the ACL connection policy and optionally persists it across restarts.
    fields:
      - name: persist
        type: uint8
      - name: policy
        type: acl_connection_policy

  set_acl_radio_preferences:
    description: Sets ACL PHY and data length preferences and optionally persists them across restarts.
    fields:
      - name: persist
        type: uint8
      - name: preferences
        type: acl_radio_preferences

  set_lc3_preferences:
    description: Sets LC3 codec preferences and optionally persists them across restarts.
    fields:
      - name: persist
        type: uint8
      - name: preferences
        type: lc3_preferences

  set_iso_qos_preferences:
    description: Sets CIS QoS preferences and optionally persists them across restarts.
    fields:
      - name: persist
        type: uint8
      - name: preferences
        type: iso_qos_preferences

  get_configuration:
    description: Requests the configured value for one section identified by its stable section ID.
    fields:
      - name: section
        type: uint8

  restore_defaults:
    description: Restores compiled defaults for the sections selected by section_mask, or every supported section when the mask is zero.
    fields:
      - name: section_mask
        type: uint32

  configuration_command:
    description: A correlated wireless audio configuration command with a stable tagged operation.
    fields:
      - name: request_id
        type: uint16
      - name: operation
        type: union
        tag_type: uint8
        variants:
          0: set_acl_connection_policy
          1: set_acl_radio_preferences
          2: set_lc3_preferences
          3: set_iso_qos_preferences
          4: get_configuration
          5: restore_defaults

  configured_acl_connection_policy:
    description: Reports the configured ACL connection policy and whether it is persistent.
    fields:
      - name: persisted
        type: uint8
      - name: policy
        type: acl_connection_policy

  configured_acl_radio_preferences:
    description: Reports configured ACL radio preferences and whether they are persistent.
    fields:
      - name: persisted
        type: uint8
      - name: preferences
        type: acl_radio_preferences

  configured_lc3_preferences:
    description: Reports configured LC3 preferences and whether they are persistent.
    fields:
      - name: persisted
        type: uint8
      - name: preferences
        type: lc3_preferences

  configured_iso_qos_preferences:
    description: Reports configured CIS QoS preferences and whether they are persistent.
    fields:
      - name: persisted
        type: uint8
      - name: preferences
        type: iso_qos_preferences

  command_result:
    description: Reports whether a command was accepted and whether applying it requires a connection or stream restart.
    fields:
      - name: status
        type: uint8
      - name: error_domain
        type: uint8
      - name: error_code
        type: int32
      - name: restart_required_mask
        type: uint32

  configuration_response:
    description: A response correlated to a configuration command. Type 0 is a command result and types 1 through 4 report one configuration section.
    fields:
      - name: request_id
        type: uint16
      - name: payload
        type: union
        tag_type: uint8
        variants:
          0: command_result
          1: configured_acl_connection_policy
          2: configured_acl_radio_preferences
          3: configured_lc3_preferences
          4: configured_iso_qos_preferences

  runtime_state:
    description: Reports effective ACL parameters and negotiated LE Audio configuration for one connection and stream; fields without a corresponding validity flag are zero.
    fields:
      - name: sequence
        type: uint32
      - name: validity_flags
        type: uint32
      - name: connection_id
        type: uint16
      - name: stream_id
        type: uint8
      - name: direction
        type: uint8
      - name: lifecycle_state
        type: uint8
      - name: acl_interval_us
        type: uint32
      - name: acl_peripheral_latency
        type: uint16
      - name: acl_supervision_timeout_ms
        type: uint32
      - name: transmit_phy
        type: uint8
      - name: receive_phy
        type: uint8
      - name: transmit_data_octets
        type: uint16
      - name: receive_data_octets
        type: uint16
      - name: lc3_sampling_frequency_hz
        type: uint32
      - name: lc3_frame_duration_us
        type: uint16
      - name: lc3_octets_per_frame
        type: uint16
      - name: lc3_frame_blocks_per_sdu
        type: uint8
      - name: lc3_channel_allocation
        type: uint32
      - name: iso_sdu_interval_us
        type: uint32
      - name: iso_framing
        type: uint8
      - name: iso_phy
        type: uint8
      - name: iso_retransmission_number
        type: uint8
      - name: iso_maximum_sdu_octets
        type: uint16
      - name: iso_maximum_transport_latency_ms
        type: uint16
      - name: presentation_delay_us
        type: uint32
      - name: audio_underrun_count
        type: uint32
      - name: acl_adjustment_count
        type: uint32

  capabilities:
    description: Reports supported configuration sections, policy types, radio features, and value ranges for this firmware build and controller.
    fields:
      - name: protocol_version
        type: uint16
      - name: supported_section_mask
        type: uint32
      - name: supported_command_mask
        type: uint32
      - name: supported_acl_policy_mask
        type: uint32
      - name: supported_phy_mask
        type: uint8
      - name: minimum_acl_interval_us
        type: uint32
      - name: maximum_acl_interval_us
        type: uint32
      - name: acl_interval_resolution_us
        type: uint32
      - name: maximum_acl_peripheral_latency
        type: uint16
      - name: minimum_acl_supervision_timeout_ms
        type: uint32
      - name: maximum_acl_supervision_timeout_ms
        type: uint32
      - name: maximum_acl_data_octets
        type: uint16
      - name: supported_lc3_sampling_frequency_mask
        type: uint16
      - name: supported_lc3_frame_duration_mask
        type: uint8
      - name: minimum_lc3_octets_per_frame
        type: uint16
      - name: maximum_lc3_octets_per_frame
        type: uint16
      - name: maximum_lc3_frame_blocks_per_sdu
        type: uint8
      - name: maximum_iso_retransmission_number
        type: uint8
      - name: maximum_iso_sdu_octets
        type: uint16
      - name: maximum_iso_transport_latency_ms
        type: uint16
      - name: minimum_presentation_delay_us
        type: uint32
      - name: maximum_presentation_delay_us
        type: uint32
      - name: feature_flags
        type: uint32
